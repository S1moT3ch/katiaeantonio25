<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; color: white; padding: 50px; font-family: sans-serif; }
    .stage { perspective: 1000px; width: 300px; height: 300px; margin: 0 auto; border: 1px solid red; position: relative; }
    .leaf { width: 100%; height: 100%; position: absolute; top: 100%; background: blue; transform-origin: top center; transform: rotateX(180deg); transform-style: preserve-3d; }
    .front { position: absolute; width: 100%; height: 100%; background: green; backface-visibility: hidden; }
    .back { position: absolute; width: 100%; height: 100%; background: yellow; color: black; transform: rotateX(180deg); backface-visibility: hidden; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="leaf">
      <div class="front">FRONT</div>
      <div class="back">BACK</div>
    </div>
  </div>
</body>
</html>
